name: Corregir dependencias frontend

on:
  push:
    branches:
      - agent/integrar-aplicaciones-2-3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corregir-y-validar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: agent/integrar-aplicaciones-2-3

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Aplicar correcciones compatibles de seguridad
        run: npm audit fix

      - name: Comprobar vulnerabilidades altas
        run: npm audit --audit-level=high

      - name: Ejecutar pruebas
        run: npm test

      - name: Validar ESLint
        run: npm run lint

      - name: Compilar aplicación
        run: npm run build

      - name: Publicar cambios compatibles
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hubo cambios de dependencias para publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Actualizar dependencias vulnerables compatibles"
          git push origin HEAD:agent/integrar-aplicaciones-2-3
