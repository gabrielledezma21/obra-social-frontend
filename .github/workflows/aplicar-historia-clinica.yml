name: Aplicar historia clínica unificada

on:
  push:
    branches:
      - agent/integrar-aplicaciones-2-3
    paths:
      - scripts/mejorarHistoriaClinica.cjs
      - .github/workflows/aplicar-historia-clinica.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: agent/integrar-aplicaciones-2-3
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Unificar historia clínica
        run: node scripts/mejorarHistoriaClinica.cjs

      - name: Aplicar formato
        run: npm run lint:fix

      - name: Ejecutar pruebas
        run: npm test

      - name: Validar ESLint
        run: npm run lint

      - name: Compilar aplicación
        run: npm run build

      - name: Publicar integración
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portales/PortalPrestador.jsx src/pages/portales/PortalAfiliado.jsx src/layout/DisenoPortal.jsx src/components/portales/HistoriaClinicaPrestador.jsx src/services/portal.js tests/historiaClinicaPrestador.test.js
          if git diff --cached --quiet; then
            echo "No hay cambios para publicar"
            exit 0
          fi
          git commit -m "Unificar historia clínica y cierre de sesión"
          git push origin HEAD:agent/integrar-aplicaciones-2-3
