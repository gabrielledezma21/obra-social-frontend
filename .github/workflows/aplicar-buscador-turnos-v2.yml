name: Aplicar buscador de turnos v2

on:
  push:
    branches:
      - agent/integrar-aplicaciones-2-3

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: agent/integrar-aplicaciones-2-3
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Integrar buscador renovado
        run: node scripts/actualizarBuscadorTurnosV2.cjs

      - name: Aplicar formato
        run: npm run lint:fix

      - name: Ejecutar pruebas actualizadas
        run: npm test

      - name: Validar ESLint
        run: npm run lint

      - name: Compilar aplicación
        run: npm run build

      - name: Publicar integración
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/portales/PortalAfiliado.jsx src/components/portales/GestionTurnosAfiliado.jsx src/services/portal.js
          if git diff --cached --quiet; then
            echo "No hay cambios para publicar"
            exit 0
          fi
          git commit -m "Integrar próximos turnos y autocompletado de prestadores"
          git push origin HEAD:agent/integrar-aplicaciones-2-3
